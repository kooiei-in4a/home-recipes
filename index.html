<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koo's Kitchen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap');

  :root {
    --red: #D62B2B;
    --dark: #1a1008;
    --cream: #FFF8EE;
    --gold: #C9922A;
    --paper: #fffdf8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--dark);
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px 56px;
  }

  header {
    border-top: 6px solid var(--red);
    border-bottom: 3px solid var(--red);
    padding: 20px 0 16px;
    margin-bottom: 32px;
  }

  .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    line-height: 1;
    letter-spacing: .04em;
  }

  .subtitle {
    margin-top: 8px;
    color: #666;
    font-size: 14px;
    letter-spacing: .04em;
  }

  .section-title {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--red);
    border-bottom: 1.5px solid var(--red);
    padding-bottom: 4px;
    margin-bottom: 16px;
  }

  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }

  .recipe-card {
    display: block;
    min-height: 220px;
    background: var(--paper);
    border: 1px solid #eadbca;
    border-left: 6px solid var(--gold);
    border-radius: 8px;
    padding: 22px;
    color: inherit;
    text-decoration: none;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }

  .recipe-card:hover {
    transform: translateY(-2px);
    border-color: var(--red);
    box-shadow: 0 12px 24px rgba(26, 16, 8, .12);
  }

  .recipe-card .eyebrow {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .18em;
    color: var(--red);
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .recipe-card h2 {
    font-size: 24px;
    line-height: 1.35;
    margin-bottom: 12px;
  }

  .recipe-card p {
    color: #666;
    font-size: 14px;
    line-height: 1.7;
  }

  .meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  .meta span {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 4px 10px;
    background: #fdeaea;
    border-radius: 6px;
    color: var(--red);
    font-size: 12px;
    font-weight: 700;
  }

  footer {
    border-top: 1px solid #ddd;
    margin-top: 36px;
    padding-top: 12px;
    color: #aaa;
    font-size: 11px;
  }

  @media (max-width: 560px) {
    body { padding: 28px 18px 44px; }
    h1 { font-size: 44px; }
    .recipe-card { min-height: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="label">Home Recipes</div>
  <h1>Koo's Kitchen</h1>
  <p class="subtitle">家で作る、気軽でおいしいレシピ置き場</p>
</header>

<main>
  <div class="section-title">Recipes</div>
  <div class="recipe-grid">
    <a class="recipe-card" href="recipes/marutai-ramen.html">
      <div class="eyebrow">Ramen</div>
      <h2>業スー マルタイ棒ラーメン</h2>
      <p>業務スーパー × マルタイ棒ラーメン（業務用）で作る、コスパ重視の一杯。</p>
      <div class="meta">
        <span>1食 約60円</span>
        <span>ラーメン</span>
      </div>
    </a>
  </div>
</main>

<footer>Koo's Kitchen</footer>
</body>
</html>
